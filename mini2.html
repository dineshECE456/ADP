```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Report Collector</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #1e293b;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    font-size: 26px;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #00000010;
}

.card h3 {
    color: #64748b;
    font-size: 15px;
}

.card h2 {
    margin-top: 12px;
    font-size: 30px;
    color: #2563eb;
}

.form-box, .reports-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 3px 10px #00000010;
}

h2 {
    margin-bottom: 20px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 14px;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.submit-btn {
    background: #2563eb;
    color: white;
}

.submit-btn:hover {
    background: #1d4ed8;
}

.export-btn {
    background: #16a34a;
    color: white;
    margin-bottom: 15px;
}

.delete-btn {
    background: #ef4444;
    color: white;
    padding: 7px 12px;
}

.report {
    border: 1px solid #e2e8f0;
    border-left: 5px solid #2563eb;
    padding: 18px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.report h3 {
    margin-bottom: 8px;
}

.report p {
    margin-bottom: 7px;
    color: #475569;
    overflow-wrap: anywhere;
}

.search {
    margin-top: 10px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media(max-width:600px) {
    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Student Report Collector</h1>
    <p>College Report Management System</p>
</header>

<div class="container">

    <!-- Dashboard -->

    <div class="dashboard">

        <div class="card">
            <h3>Total Reports</h3>
            <h2 id="totalReports">0</h2>
        </div>

        <div class="card">
            <h3>Total Students</h3>
            <h2 id="totalStudents">0</h2>
        </div>

    </div>

    <!-- Report Submission Form -->

    <div class="form-box">

        <h2>Submit Student Report</h2>

        <form id="reportForm">

            <input type="text"
            id="studentName"
            placeholder="Student Name"
            required>

            <input type="text"
            id="registerNumber"
            placeholder="Register Number"
            required>

            <select id="department" required>
                <option value="">Select Department</option>
                <option>ECE</option>
                <option>CSE</option>
                <option>EEE</option>
                <option>Mechanical</option>
                <option>Civil</option>
                <option>IT</option>
            </select>

            <select id="year" required>
                <option value="">Select Year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
            </select>

            <input type="text"
            id="subject"
            placeholder="Subject Name"
            required>

            <input type="text"
            id="reportTitle"
            placeholder="Report Title"
            required>

            <textarea
            id="description"
            placeholder="Report Description"
            required></textarea>

            <button type="submit" class="submit-btn">
                Submit Report
            </button>

        </form>

    </div>

    <!-- Report Collection -->

    <div class="reports-box">

        <h2>Collected Reports</h2>

        <input
        type="text"
        id="search"
        class="search"
        placeholder="Search by name or register number...">

        <button class="export-btn" onclick="exportCSV()">
            Download Reports (CSV)
        </button>

        <div id="reportList"></div>

    </div>

</div>

<footer>
    Student Report Collector | College Project
</footer>

<script>

// Load reports from browser storage

let reports = JSON.parse(
    localStorage.getItem("studentReports") || "[]"
);

// Save reports

function saveReports() {
    localStorage.setItem(
        "studentReports",
        JSON.stringify(reports)
    );
}

// Submit report

document.getElementById("reportForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const report = {

        id: Date.now(),

        name: document.getElementById("studentName").value,

        register: document.getElementById("registerNumber").value,

        department: document.getElementById("department").value,

        year: document.getElementById("year").value,

        subject: document.getElementById("subject").value,

        title: document.getElementById("reportTitle").value,

        description: document.getElementById("description").value,

        date: new Date().toLocaleDateString()

    };

    reports.push(report);

    saveReports();

    this.reset();

    displayReports();

    alert("Report submitted successfully!");

});

// Display reports

function displayReports() {

    const list = document.getElementById("reportList");

    const search = document.getElementById("search")
    .value.toLowerCase();

    list.innerHTML = "";

    const filtered = reports.filter(report =>

        report.name.toLowerCase().includes(search) ||

        report.register.toLowerCase().includes(search)

    );

    filtered.forEach(report => {

        list.innerHTML += `

        <div class="report">

            <h3>${escapeHTML(report.title)}</h3>

            <p><b>Student:</b> ${escapeHTML(report.name)}</p>

            <p><b>Register Number:</b> ${escapeHTML(report.register)}</p>

            <p><b>Department:</b> ${escapeHTML(report.department)}</p>

            <p><b>Year:</b> ${escapeHTML(report.year)}</p>

            <p><b>Subject:</b> ${escapeHTML(report.subject)}</p>

            <p><b>Description:</b> ${escapeHTML(report.description)}</p>

            <p><b>Date:</b> ${escapeHTML(report.date)}</p>

            <button class="delete-btn"
            onclick="deleteReport(${report.id})">
            Delete
            </button>

        </div>

        `;

    });

    document.getElementById("totalReports").innerText =
        reports.length;

    const uniqueStudents = new Set(
        reports.map(report => report.register.toLowerCase())
    );

    document.getElementById("totalStudents").innerText =
        uniqueStudents.size;

}

// Escape user input before displaying it

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);

}

// Delete report

function deleteReport(id) {

    if(confirm("Are you sure you want to delete this report?")) {

        reports = reports.filter(report => report.id !== id);

        saveReports();

        displayReports();

    }

}

// Search reports

document.getElementById("search")
.addEventListener("input", displayReports);

// Export reports to CSV

function exportCSV() {

    if(reports.length === 0) {
        alert("No reports available!");
        return;
    }

    const headers = [
        "Name",
        "Register Number",
        "Department",
        "Year",
        "Subject",
        "Title",
        "Description",
        "Date"
    ];

    const rows = reports.map(r => [
        r.name,
        r.register,
        r.department,
        r.year,
        r.subject,
        r.title,
        r.description,
        r.date
    ]);

    const csv = [headers, ...rows]
        .map(row => row.map(value =>
            '"' + String(value).replace(/"/g, '""') + '"'
        ).join(","))
        .join("\n");

    const blob = new Blob(
        ["\uFEFF" + csv],
        {type: "text/csv;charset=utf-8;"}
    );

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);

    link.download = "Student_Reports.csv";

    link.click();

    URL.revokeObjectURL(link.href);

}

// Initial display

displayReports();

</script>

</body>
</html>
